<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Protected Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="min-h-screen flex flex-col items-center justify-center p-4">

        <!-- Login Form -->
        <div id="login-view" class="w-full max-w-sm p-8 bg-white rounded-xl shadow-lg space-y-6">
            <h1 class="text-2xl font-bold text-center text-gray-900">Login Required</h1>
            <p class="text-center text-sm text-gray-600">Please enter your ID and password to continue.</p>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label for="userid" class="text-sm font-medium text-gray-700">User ID</label>
                    <input type="text" id="userid" name="userid" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div>
                    <label for="password" class="text-sm font-medium text-gray-700">Password</label>
                    <input type="password" id="password" name="password" required class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                    Login
                </button>
            </form>

            <div id="error-message" class="text-red-500 text-sm text-center hidden">
                Invalid ID or password. Please try again.
            </div>
        </div>

    </div>

    <script>
        // --- CONFIGURATION ---
        
        // Set the correct User ID here
        const CORRECT_ID = "admin";

        // Set the correct password here
        const CORRECT_PASSWORD = "password123";

        // Set the URL to redirect to after successful login
        const REDIRECT_URL = "https://aftab1836.github.io/Attendance./";

        // --- APPLICATION LOGIC ---

        const loginForm = document.getElementById('login-form');
        const idInput = document.getElementById('userid');
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('error-message');

        loginForm.addEventListener('submit', function(event) {
            // Prevent the form from submitting the traditional way
            event.preventDefault();

            // Get the values from the input fields
            const enteredId = idInput.value;
            const enteredPassword = passwordInput.value;

            // Check if both the ID and password match the correct ones
            if (enteredId === CORRECT_ID && enteredPassword === CORRECT_PASSWORD) {
                // If correct, hide any error message
                errorMessage.classList.add('hidden');
                
                // Announce success and redirect
                console.log('Credentials correct. Redirecting...');
                window.location.href = REDIRECT_URL;

            } else {
                // If incorrect, show the error message
                errorMessage.classList.remove('hidden');
                
                // Clear both fields
                idInput.value = "";
                passwordInput.value = "";
                idInput.focus(); // Set focus back to the ID field
            }
        });
    </script>

</body>
</html>
